<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Evita que el navegador se quede con una versión antigua del HTML y cargue scripts viejos -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>NutriPlan</title>
  <link rel="stylesheet" href="css/styles.css?v=30" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">◑</div>
        <span class="brand-name" data-app-name>NutriPlan</span>
      </div>
      <nav class="nav">
        <a href="#/pacientes" class="nav-item" data-nav="pacientes">
          <span class="nav-ic">👥</span><span class="nav-tx">Pacientes</span>
        </a>
        <a href="#/recetas" class="nav-item" data-nav="recetas">
          <span class="nav-ic">🍽️</span><span class="nav-tx">Recetas</span>
        </a>
        <a href="#/constructor" class="nav-item" data-nav="constructor">
          <span class="nav-ic">🧩</span><span class="nav-tx">Constructor</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <span class="muted small">MVP · <span data-app-name>NutriPlan</span></span>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn only-mobile" id="btn-menu" title="Menú">☰</button>
          <h1 class="page-title" id="page-title">Pacientes</h1>
        </div>
        <div class="topbar-right">
          <span class="pill" id="ctx-pill" hidden></span>
        </div>
      </header>
      <main id="view" class="view"><!-- vistas se inyectan aquí --></main>
    </div>
  </div>

  <!-- Overlay para modales -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Orden de carga importante (scripts clásicos, namespace global NP) -->
  <script src="js/util.js?v=30"></script>
  <script src="js/nutrition.js?v=30"></script>
  <script src="js/data.js?v=30"></script>
  <script src="js/store.js?v=30"></script>
  <script src="js/calorias.js?v=30"></script>
  <script src="js/dri.js?v=30"></script>
  <script src="js/pdf.js?v=30"></script>
  <script src="js/views/pacientes.js?v=30"></script>
  <script src="js/views/recetas.js?v=30"></script>
  <script src="js/views/constructor.js?v=30"></script>
  <script src="js/views/plan.js?v=30"></script>
  <script src="js/views/mensajes.js?v=30"></script>
  <script src="js/app.js?v=30"></script>
</body>
</html>
