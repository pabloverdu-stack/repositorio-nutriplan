<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Evita que el navegador se quede con una versión antigua del HTML y cargue scripts viejos -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>NutriPlan</title>
  <link rel="stylesheet" href="css/styles.css?v=35" />
</head>
<body>
  <!-- Pantalla de acceso (elegir rol, entrar, crear cuenta). Se rellena desde js/views/acceso.js -->
  <div id="auth-root" hidden></div>

  <div id="app" hidden>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">◑</div>
        <span class="brand-name" data-app-name>NutriPlan</span>
      </div>
      <!-- El menú y la ficha de sesión se construyen según el rol (js/app.js) -->
      <nav class="nav"></nav>
      <div class="sidebar-foot"></div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn only-mobile" id="btn-menu" title="Menú">☰</button>
          <h1 class="page-title" id="page-title">Pacientes</h1>
        </div>
        <div class="topbar-right">
          <span class="pill" id="ctx-pill" hidden></span>
        </div>
      </header>
      <main id="view" class="view"><!-- vistas se inyectan aquí --></main>
    </div>
  </div>

  <!-- Overlay para modales -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Librería de Supabase. Solo se usa si js/config.js tiene las claves;
       si no carga (sin internet), la app sigue funcionando en local. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <!-- Orden de carga importante (scripts clásicos, namespace global NP) -->
  <script src="js/util.js?v=35"></script>
  <script src="js/nutrition.js?v=35"></script>
  <script src="js/data.js?v=35"></script>
  <script src="js/store.js?v=35"></script>
  <script src="js/auth.js?v=35"></script>
  <script src="js/config.js?v=35"></script>
  <script src="js/nube.js?v=35"></script>
  <script src="js/calorias.js?v=35"></script>
  <script src="js/dri.js?v=35"></script>
  <script src="js/pdf.js?v=35"></script>
  <script src="js/documentos.js?v=35"></script>
  <script src="js/views/acceso.js?v=35"></script>
  <script src="js/views/pacientes.js?v=35"></script>
  <script src="js/views/recetas.js?v=35"></script>
  <script src="js/views/constructor.js?v=35"></script>
  <script src="js/views/plan.js?v=35"></script>
  <script src="js/views/mensajes.js?v=35"></script>
  <script src="js/views/cliente.js?v=35"></script>
  <script src="js/app.js?v=35"></script>
</body>
</html>
